name: Live Integration

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network to test against
        required: false
        default: testnet
      dpns_name:
        description: Optional DPNS fixture name
        required: false
        default: ''
  schedule:
    - cron: '17 8 * * *'

jobs:
  live-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run live SDK checks
        run: node scripts/live-integration.mjs
        env:
          NPE_LIVE_NETWORK: ${{ github.event.inputs.network || 'testnet' }}
          NPE_LIVE_DPNS_NAME: ${{ github.event.inputs.dpns_name || '' }}
