name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Resolve deployment prefix
        id: pages
        uses: actions/configure-pages@v5
      - name: Build the deployment artifact
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test the exact export at its deployment prefix
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm e2e
      - name: Prepare Pages files
        run: touch out/.nojekyll
      - name: Preserve the validated build
        uses: actions/upload-artifact@v4
        with:
          name: validated-pages
          path: out
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results
          if-no-files-found: ignore
